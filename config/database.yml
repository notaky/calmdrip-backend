default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  port: 5432

development:
  <<: *default
  host: db
  database: api_development
  password: password

test:
  <<: *default
  host: db
  database: api_test
  password: password

production:
  <<: *default
  database: calmdrip_production
  url: <%= Rails.application.credentials.production.database_url %>