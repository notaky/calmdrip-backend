services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "tail -f log/development.log"
    tty: true
    stdin_open: true
    volumes:
      - .:/api
    environment:
      TZ: Asia/Tokyo
    ports:
      - 3000:3000
    depends_on:
      - db
  db:
    image: postgres:18.6
    environment:
      TZ: Asia/Tokyo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql
volumes:
  postgresql_data: